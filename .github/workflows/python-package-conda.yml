name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-activate-base: false
        python-version: '3.10'
        miniforge-variant: Mambaforge

    - name: Create or update Conda env
      run: |
        if [ -f environment.yml ]; then
          conda env create -f environment.yml -n ci || conda env update -f environment.yml -n ci
        else
          echo "environment.yml not found — creating a minimal 'ci' environment with required tools"
          conda create -y -n ci python=3.10 pytest flake8
        fi

    - name: Lint with flake8
      run: |
        conda run -n ci flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        conda run -n ci flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        conda run -n ci pytest
