name: Scientists CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.13"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run mypy scientists
      - run: uv run python scripts/verify.py
