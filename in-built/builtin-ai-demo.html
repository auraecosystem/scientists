<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scientists — Chrome Built-in AI</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; }
    button { padding: 10px 14px; margin-right: 8px; }
    progress { width: 100%; margin: 16px 0 8px; }
    #status { min-height: 1.5em; }
    output { display: block; white-space: pre-wrap; border: 1px solid #ccc; padding: 16px; min-height: 120px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Scientists local AI</h1>
  <p id="status">Local model is not initialized.</p>
  <progress id="progress" max="1" value="0" hidden></progress>
  <button id="create">Load local model</button>
  <button id="prompt" disabled>Ask scientist</button>
  <output id="output" aria-live="polite"></output>

  <script type="module">
    import { createLocalSession, promptToText } from './builtin-ai.mjs';

    const createButton = document.querySelector('#create');
    const promptButton = document.querySelector('#prompt');
    const progress = document.querySelector('#progress');
    const status = document.querySelector('#status');
    const output = document.querySelector('#output');
    let session = null;

    createButton.addEventListener('click', async () => {
      createButton.disabled = true;
      output.textContent = '';
      progress.hidden = false;
      progress.value = 0;

      try {
        session = await createLocalSession({
          onStatus({ state, availability }) {
            status.textContent = state === 'ready'
              ? `Local model ready (${availability}).`
              : 'Downloading local AI model…';
          },
          onProgress({ loaded, extracting }) {
            progress.value = loaded;
            status.textContent = extracting
              ? 'Download complete; extracting and loading model into memory…'
              : `Downloading local model: ${Math.round(loaded * 100)}%`;
          },
        });
        promptButton.disabled = false;
        progress.hidden = true;
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : String(error);
        createButton.disabled = false;
        progress.hidden = true;
      }
    });

    promptButton.addEventListener('click', async () => {
      promptButton.disabled = true;
      output.textContent = '';
      try {
        await promptToText(
          session,
          'Explain scientific reproducibility in three concise points.',
          (chunk) => { output.append(chunk); },
        );
      } catch (error) {
        output.textContent = error instanceof Error ? error.message : String(error);
      } finally {
        promptButton.disabled = false;
      }
    });
  </script>
</body>
</html>
