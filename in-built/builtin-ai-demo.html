<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scientists — Built-in AI with fallback</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; }
    button { padding: 10px 14px; margin-right: 8px; }
    progress { width: 100%; margin: 16px 0 8px; }
    #status { min-height: 1.5em; }
    output { display: block; white-space: pre-wrap; border: 1px solid #ccc; padding: 16px; min-height: 120px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Scientists AI</h1>
  <p id="status">The app will use Chrome Built-in AI when available, otherwise WebLLM or the cloud fallback.</p>
  <progress id="progress" max="1" value="0" hidden></progress>
  <button id="create">Initialize AI</button>
  <button id="prompt" disabled>Ask scientist</button>
  <output id="output" aria-live="polite"></output>

  <script type="module">
    import { createSmartSession } from './builtin-ai.mjs';

    function init() {
      const createButton = document.querySelector('#create');
      const promptButton = document.querySelector('#prompt');
      const progress = document.querySelector('#progress');
      const status = document.querySelector('#status');
      const output = document.querySelector('#output');

      if (!createButton || !promptButton || !progress || !status || !output) {
        console.error('Scientists AI demo: required DOM elements are missing.');
        return;
      }

      let session = null;
      let sessionCreationTriggered = false;

      const hideProgress = () => {
        progress.hidden = true;
        progress.value = 0;
        progress.setAttribute('aria-label', 'AI model loading progress');
      };

      const showDownloadProgress = () => {
        progress.hidden = false;
        progress.value = 0;
        progress.setAttribute('aria-label', 'Downloading local AI model');
      };

      const createSession = async (options = {}) => {
        if (sessionCreationTriggered) return undefined;

        sessionCreationTriggered = true;
        showDownloadProgress();

        try {
          session = await createSmartSession({
            options,
            fallbackEndpoint: '/api/chat-fallback',
            onStatus({ state, source, availability }) {
              if (source === 'cloud') {
                status.textContent = 'Chrome Built-in AI/WebLLM unavailable; using cloud fallback.';
                hideProgress();
              } else if (source === 'webllm' && state === 'downloading') {
                status.textContent = 'Loading WebLLM model in your browser…';
                showDownloadProgress();
              } else if (state === 'downloading') {
                status.textContent = 'Downloading local AI model…';
                showDownloadProgress();
              } else if (state === 'ready') {
                status.textContent = source === 'webllm'
                  ? `WebLLM model ready (${availability ?? 'WebGPU'}).`
                  : `Local model ready (${availability ?? 'available'}).`;
                hideProgress();
              }
            },
            onProgress({ loaded, extracting, source }) {
              progress.hidden = false;
              if (extracting) {
                progress.removeAttribute('value');
                status.textContent = source === 'webllm'
                  ? 'Model downloaded; initializing WebGPU engine…'
                  : 'Download complete; extracting and loading model into memory…';
              } else {
                progress.max = 1;
                progress.value = loaded;
                status.textContent = source === 'webllm'
                  ? `Loading WebLLM model: ${Math.round(loaded * 100)}%`
                  : `Downloading local model: ${Math.round(loaded * 100)}%`;
              }
            },
          });

          return session;
        } catch (error) {
          session = null;
          throw error;
        } finally {
          // Always clear the guard so a failed initialization can be retried.
          sessionCreationTriggered = false;
        }
      };

      createButton.addEventListener('click', async () => {
        if (sessionCreationTriggered) return;

        createButton.disabled = true;
        promptButton.disabled = true;
        output.textContent = '';

        try {
          const options = {
            expectedInputs: [{ type: 'text', languages: ['en'] }],
            expectedOutputs: [{ type: 'text', languages: ['en'] }],
          };

          const created = await createSession(options);
          if (!created) throw new Error('AI session creation is already in progress.');
          promptButton.disabled = false;
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : String(error);
          createButton.disabled = false;
          hideProgress();
        }
      });

      promptButton.addEventListener('click', async () => {
        if (!session) return;

        promptButton.disabled = true;
        output.textContent = '';

        try {
          // Render the accumulated response. This works whether the provider
          // emits delta chunks or cumulative chunks.
          await session.promptToText(
            'Explain scientific reproducibility in three concise points.',
            (_chunk, accumulated) => { output.textContent = accumulated; },
          );
        } catch (error) {
          output.textContent = error instanceof Error ? error.message : String(error);
        } finally {
          promptButton.disabled = false;
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
      init();
    }
  </script>
</body>
</html>
